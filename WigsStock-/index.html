<title>WigsStock עברה לכתובת חדשה</title>
<meta http-equiv="refresh" content="0; url=https://wigsstock-sync.benzi-naor.workers.dev/">
<script>
  // The old installed app still has a service worker on this address; remove it
  // so the phone stops showing the old cached version, then go to the new app.
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      }
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) {}
    location.replace('https://wigsstock-sync.benzi-naor.workers.dev/');
  })();
</script>
